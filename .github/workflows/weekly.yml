# Weekly commit: on Saturday at 23:00 (Europe/Warsaw) the week ending that day, Sunday to Saturday, goes from the
# working branch "bufor" to main as one commit. On 2026-10-10 that is 2026-10-04 to 2026-10-10.
# Day to day the app and Claude save to "bufor", so main only gets this one commit a week.
# Afterwards "bufor" is rebuilt on top of the new main (its old save commits disappear), keeping
# whatever main doesn't have yet, e.g. a late Saturday entry (it comes along next week).
# Running it again (or by hand: Actions -> Weekly commit -> Run workflow) changes nothing new.
name: Weekly commit

on:
  schedule:
    - cron: '0 21,22 * * 6' # 23:00 in Warsaw is 21:00 UTC in summer and 22:00 UTC in winter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-commit
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Warsaw
      STAGING: bufor
    steps:
      # A run delayed past midnight still goes on Sunday: then the finished week is the same one.
      - name: Only Saturday from 23:00 in Warsaw
        id: gate
        run: |
          read -r dow hour <<< "$(date '+%u %H')"
          saturday_night=$([ "$dow" = 6 ] && [ "$((10#$hour))" -ge 23 ] && echo true || echo false)
          if [ "${{ github.event_name }}" = schedule ] && [ "$saturday_night" = false ] && [ "$dow" != 7 ]; then
            echo "Nie sobota po 23:00 w Warszawie ($dow $hour), pomijam."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          # Saturday night: count from tomorrow, so the week ending today is the finished one.
          if [ "$saturday_night" = true ]; then day=$(date -d tomorrow +%F); else day=$(date +%F); fi
          echo "day=$day" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
      - name: Move the week to main
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            if ! git fetch -q origin "$STAGING"; then
              echo "Brak gałęzi $STAGING: nic do przeniesienia."
              exit 0
            fi
            lease=$(git rev-parse FETCH_HEAD)
            git show "$lease:data/wercia.json" > "$RUNNER_TEMP/staged.json"
            # Where bufor split off main: days saved straight to main since then are kept, not wiped.
            git show "$(git merge-base origin/main "$lease"):data/wercia.json" > "$RUNNER_TEMP/base.json"

            msg=$(node scripts/weekly-commit.mjs data/wercia.json "$RUNNER_TEMP/staged.json" "${{ steps.gate.outputs.day }}" --base "$RUNNER_TEMP/base.json")
            if [ -n "$msg" ]; then
              git commit -q -m "$msg" -- data/wercia.json
              if ! git push -q origin main; then sleep 5; continue; fi
              echo "main: $msg"
            elif git merge-base --is-ancestor origin/main "$lease"; then
              echo "main jest aktualny, $STAGING już na nim stoi."
              exit 0
            fi

            # "bufor" again on top of main, with the days that haven't gone to main yet.
            git checkout -q -B "$STAGING"
            cp "$RUNNER_TEMP/staged.json" data/wercia.json
            git diff --quiet || git commit -q -m "bufor: dni czekające na kolejny tydzień" -- data/wercia.json
            # Fails if the app saved something in the meantime; then the whole step runs again.
            if git push -q --force-with-lease="$STAGING:$lease" origin "$STAGING"; then
              echo "$STAGING przebudowany na main."
              exit 0
            fi
            sleep 5
          done
          echo "Nie udało się po 3 próbach." >&2
          exit 1
