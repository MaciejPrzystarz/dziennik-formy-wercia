<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <defs>
    <!-- kitty head in a space helmet, centred on 0,0 -->
    <g id="kitty">
      <circle r="58" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="2.5"/>
      <path d="M-40 20A46 46 0 0 1-30-34" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
      <path d="M-34-6-30-36-12-22zM34-6 30-36 12-22z" fill="#FFFFFF" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="0" cy="6" rx="38" ry="28" fill="#FFFFFF" stroke="#000" stroke-width="3"/>
      <ellipse cx="-14" cy="8" rx="3.2" ry="4.6" fill="#000"/>
      <ellipse cx="14" cy="8" rx="3.2" ry="4.6" fill="#000"/>
      <ellipse cx="0" cy="15" rx="4" ry="3" fill="#FFD23F" stroke="#000" stroke-width="1.5"/>
      <path d="M-24 10h-20M-24 16l-19 4M24 10h20M24 16l19 4" stroke="#000" stroke-width="2" stroke-linecap="round"/>
      <path d="M22-24 10-36 9-14zM22-24 36-34 34-12z" fill="#E4002B" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="22" cy="-24" r="5" fill="#E4002B" stroke="#000" stroke-width="2"/>
      <!-- raised paw with claws out -->
      <path d="M40 30l-3-12M46 28l1-13M52 31l5-11" stroke="#000" stroke-width="3" stroke-linecap="round"/>
      <circle cx="46" cy="36" r="10" fill="#FFFFFF" stroke="#000" stroke-width="3"/>
    </g>
    <!-- three claw scratches -->
    <g id="claws" fill="none" stroke-linecap="round">
      <path d="M0 0c10 14 18 34 20 56M14-4c10 16 17 36 18 58M28-6c9 16 15 36 15 56" stroke="#E4002B" stroke-width="5"/>
      <path d="M0 0c10 14 18 34 20 56M14-4c10 16 17 36 18 58M28-6c9 16 15 36 15 56" stroke="#FF8FC4" stroke-width="1.5" stroke-opacity=".7"/>
    </g>
    <path id="spark" d="M0-9C1-2 2-1 9 0 2 1 1 2 0 9-1 2-2 1-9 0-2-1-1-2 0-9z"/>
  </defs>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="24" cy="40" r="1.4" opacity=".8"/><circle cx="210" cy="22" r="1" opacity=".6"/>
    <circle cx="300" cy="96" r="1.6" opacity=".7"/><circle cx="470" cy="60" r="1.2" opacity=".8"/>
    <circle cx="530" cy="190" r="1.5" opacity=".6"/><circle cx="388" cy="236" r="1" opacity=".7"/>
    <circle cx="60" cy="300" r="1.2" opacity=".7"/><circle cx="160" cy="380" r="1.6" opacity=".6"/>
    <circle cx="250" cy="520" r="1.2" opacity=".8"/><circle cx="420" cy="500" r="1" opacity=".6"/>
    <circle cx="520" cy="420" r="1.4" opacity=".7"/><circle cx="96" cy="500" r="1" opacity=".7"/>
    <circle cx="330" cy="330" r="1.2" opacity=".5"/><circle cx="20" cy="170" r="1" opacity=".6"/>
  </g>
  <g opacity=".75">
    <use href="#spark" x="250" y="160" fill="#FF5CAD"/>
    <use href="#spark" fill="#FFFFFF" transform="translate(500 300) scale(.7)"/>
    <use href="#spark" x="40" y="420" fill="#E4002B"/>
    <use href="#spark" fill="#FF5CAD" transform="translate(360 440) scale(.6)"/>
  </g>

  <!-- kitty floating, with a claw swipe next to her -->
  <g opacity=".9" transform="translate(120 130) rotate(-14) scale(.85)"><use href="#kitty"/></g>
  <g opacity=".75" transform="translate(196 196) rotate(-24)"><use href="#claws"/></g>

  <!-- ringed planet -->
  <g opacity=".85" transform="translate(410 360) rotate(-18)">
    <circle r="30" fill="#E4002B" stroke="#000" stroke-width="3"/>
    <path d="M-30 0a30 30 0 0 0 60 0" fill="#000" fill-opacity=".25"/>
    <ellipse rx="54" ry="13" fill="none" stroke="#FF5CAD" stroke-width="5"/>
    <path d="M-30-6a30 30 0 0 1 60 0" fill="#E4002B" stroke="#000" stroke-width="3"/>
  </g>

  <!-- small black planet with pink rim and a second, smaller kitty -->
  <circle cx="470" cy="130" r="14" fill="#000" stroke="#FF5CAD" stroke-width="2.5" opacity=".8"/>
  <g opacity=".6" transform="translate(110 440) rotate(12) scale(.5)"><use href="#kitty"/></g>
  <g opacity=".5" transform="translate(280 400) rotate(30) scale(.6)"><use href="#claws"/></g>
</svg>
